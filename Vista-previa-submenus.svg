<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720">
<rect width="1680" height="720" fill="#000"/>
<text x="40" y="56" fill="#4ADE80" font-family="Consolas,monospace" font-size="25">CHROMEPANELFIX 9.5  /  SUBMENÚS DE ACCIONES</text>
<text x="40" y="88" fill="#60A5FA" font-family="Consolas,monospace" font-size="15">Diseño de referencia: los menús comparten fondo negro, borde verde y texto azul.</text>
<g font-family="Consolas,monospace">
 <g transform="translate(30,120)">
  <text x="0" y="0" fill="#4ADE80" font-size="17">BOTÓN 2 · SOLUCIÓN MANUAL</text>
  <rect x="0" y="20" width="380" height="70" fill="#000" stroke="#183529"/>
  <text x="18" y="50" fill="#38BDF8" font-size="17">Aplicar solución manual</text><text x="18" y="74" fill="#38BDF8" font-size="16">Sin crear tarea programada</text>
  <rect x="0" y="100" width="380" height="188" fill="#000" stroke="#547A61"/>
  <text x="16" y="132" fill="#38BDF8" font-size="15"><tspan x="16">Aplicar y abrir</tspan><tspan x="16" dy="20">Administrador del Servidor</tspan></text>
  <line x1="0" y1="194" x2="380" y2="194" stroke="#183529"/>
  <text x="16" y="226" fill="#38BDF8" font-size="15"><tspan x="16">Aplicar sin abrir</tspan><tspan x="16" dy="20">Administrador del Servidor</tspan></text>
 </g>
 <g transform="translate(450,120)">
  <text x="0" y="0" fill="#4ADE80" font-size="17">BOTÓN 3 · VIGILANCIA</text>
  <rect x="0" y="20" width="380" height="70" fill="#000" stroke="#183529"/>
  <text x="18" y="50" fill="#38BDF8" font-size="17">Guardar referencias</text><text x="18" y="74" fill="#38BDF8" font-size="16">Opciones de vigilancia</text>
  <rect x="0" y="100" width="380" height="188" fill="#000" stroke="#547A61"/>
  <text x="16" y="132" fill="#38BDF8" font-size="15"><tspan x="16">Guardar referencias y abrir</tspan><tspan x="16" dy="20">Programador de tareas</tspan></text>
  <line x1="0" y1="194" x2="380" y2="194" stroke="#183529"/>
  <text x="16" y="226" fill="#38BDF8" font-size="15"><tspan x="16">Guardar referencias sin abrir</tspan><tspan x="16" dy="20">Programador</tspan></text>
 </g>
 <g transform="translate(870,120)">
  <text x="0" y="0" fill="#4ADE80" font-size="17">BOTÓN 4 · PROCESO COMPLETO</text>
  <rect x="0" y="20" width="380" height="70" fill="#000" stroke="#183529"/>
  <text x="18" y="50" fill="#38BDF8" font-size="17">Ejecutar solución</text><text x="18" y="74" fill="#38BDF8" font-size="16">Opciones de paneles</text>
  <rect x="0" y="100" width="380" height="324" fill="#000" stroke="#547A61"/>
  <text x="16" y="134" fill="#38BDF8" font-size="15">Proceso completo y abrir ambos paneles</text>
  <line x1="0" y1="174" x2="380" y2="174" stroke="#183529"/>
  <text x="16" y="208" fill="#38BDF8" font-size="15">Proceso completo y abrir Administrador</text>
  <line x1="0" y1="248" x2="380" y2="248" stroke="#183529"/>
  <text x="16" y="282" fill="#38BDF8" font-size="15">Proceso completo y abrir Programador</text>
  <line x1="0" y1="322" x2="380" y2="322" stroke="#183529"/>
  <text x="16" y="356" fill="#38BDF8" font-size="15">Proceso completo sin abrir paneles</text>
 </g>
 <g transform="translate(1290,120)">
  <text x="0" y="0" fill="#4ADE80" font-size="17">BOTÓN 5 · DESHACER</text>
  <rect x="0" y="20" width="380" height="70" fill="#000" stroke="#183529"/>
  <text x="18" y="50" fill="#38BDF8" font-size="17">DESHACER</text><text x="18" y="74" fill="#38BDF8" font-size="16">Restaurar y abrir paneles</text>
  <rect x="0" y="100" width="380" height="324" fill="#000" stroke="#547A61"/>
  <text x="16" y="134" fill="#38BDF8" font-size="15">DESHACER y abrir ambos paneles</text>
  <line x1="0" y1="174" x2="380" y2="174" stroke="#183529"/>
  <text x="16" y="208" fill="#38BDF8" font-size="15">DESHACER y abrir Administrador</text>
  <line x1="0" y1="248" x2="380" y2="248" stroke="#183529"/>
  <text x="16" y="282" fill="#38BDF8" font-size="15">DESHACER y abrir Programador</text>
  <line x1="0" y1="322" x2="380" y2="322" stroke="#183529"/>
  <text x="16" y="356" fill="#38BDF8" font-size="15">DESHACER sin abrir paneles</text>
 </g>
</g>
<text x="40" y="630" fill="#F59E0B" font-family="Consolas,monospace" font-size="16">Opción predeterminada de DESHACER: abrir Administrador del Servidor y Programador de tareas.</text>
<text x="40" y="662" fill="#60A5FA" font-family="Consolas,monospace" font-size="14">Las vistas son composiciones de diseño, no capturas de una ejecución real.</text>
</svg>